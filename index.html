            letter-spacing: 0.5px;
            border-bottom: 2px solid #0284c7;
            padding-bottom: 5px;
            display: inline-block;
        }

        .services-card ul {
            list-style: none;
        }

        .services-card li {
            font-size: 0.95rem;
            color: #cbd5e1;
            margin-bottom: 10px;

        }

        }

        .btn-whatsapp {

            background-color: #eab308;
            color: #000000;

            font-weight: 800;
            font-size: 1.1rem;
            padding: 16px 24px;
            border-radius: 12px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(234, 179, 8, 0.4);
        }

        .btn-whatsapp:hover {
            background-color: #facc15;
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(234, 179, 8, 0.6);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes popIn {
            from {
                transform: scale(0.5);
                opacity: 0;
            }

            to {
                transform: scale(1);
                opacity: 1;
            }
        }
